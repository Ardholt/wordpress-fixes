name: Critical error after update
on:
  push:
    branches: [main]
    paths: ['critical-error-after-update/**', '.github/workflows/critical-error-after-update.yml']
  pull_request:
    paths: ['critical-error-after-update/**', '.github/workflows/critical-error-after-update.yml']
  workflow_call:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce and repair
        shell: bash
        run: |
          set -o pipefail
          cd critical-error-after-update
          ./run.sh 2>&1 | tee proof/run-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-error-proof
          path: |
            critical-error-after-update/proof/
            critical-error-after-update/media/
