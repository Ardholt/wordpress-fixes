name: Elementor update repair
on:
  push:
    branches: [main]
    paths: ['elementor-update-broke-pages/**', '.github/workflows/elementor-update-broke-pages.yml']
  pull_request:
    paths: ['elementor-update-broke-pages/**', '.github/workflows/elementor-update-broke-pages.yml']
  workflow_dispatch:
  workflow_call:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: cd elementor-update-broke-pages && ./run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elementor-update-proof
          path: |
            elementor-update-broke-pages/proof/
            elementor-update-broke-pages/media/
