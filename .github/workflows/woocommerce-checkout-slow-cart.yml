name: Checkout errors and a slow cart
on:
  push:
    branches: [main]
    paths: ['woocommerce-checkout-slow-cart/**', '.github/workflows/woocommerce-checkout-slow-cart.yml']
  pull_request:
    paths: ['woocommerce-checkout-slow-cart/**', '.github/workflows/woocommerce-checkout-slow-cart.yml']
  workflow_dispatch:
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce and verify the repair
        run: cd woocommerce-checkout-slow-cart && ./run.sh
      - name: Preserve measurements and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-proof
          path: |
            woocommerce-checkout-slow-cart/proof/
            woocommerce-checkout-slow-cart/media/
