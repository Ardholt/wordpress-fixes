name: Booking system proof
on:
  push:
    branches: [main]
    paths: ['booking-system-setup/**', '.github/workflows/booking-system-setup.yml']
  pull_request:
    paths: ['booking-system-setup/**', '.github/workflows/booking-system-setup.yml']
  workflow_dispatch:
  workflow_call:
jobs:
  booking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce and verify
        run: cd booking-system-setup && ./run.sh
      - name: Save measured proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-system-proof
          path: |
            booking-system-setup/proof/
            booking-system-setup/media/
