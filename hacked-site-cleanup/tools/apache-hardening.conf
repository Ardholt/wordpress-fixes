ServerName localhost
# The fix activates these rules by creating the marker in the site volume.
<IfFile /var/www/html/.cleanup-hardened>
  <Directory /var/www/html/wp-content/uploads>
    Options -Indexes -ExecCGI
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)(\.|$)">
      Require all denied
    </FilesMatch>
  </Directory>
  <Files xmlrpc.php>
    Require all denied
  </Files>
</IfFile>
