name: velquorra-checkout
services:
  db:
    image: mariadb:11.4.5
    environment:
      MARIADB_DATABASE: shop
      MARIADB_USER: shop
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run run.sh first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run run.sh first}
    volumes: [database:/var/lib/mysql]
  web:
    image: wordpress:6.8.3-php8.3-apache
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_DB_USER: shop
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: shop
      WORDPRESS_CONFIG_EXTRA: |
        define("WP_HOME", "http://" . ($$_SERVER["HTTP_HOST"] ?? "localhost"));
        define("WP_SITEURL", WP_HOME);
        define("DISABLE_WP_CRON", true);
    volumes:
      - wordpress:/var/www/html
      - ./source/theme:/var/www/html/wp-content/themes/velquorra:ro
      - ./runtime:/var/www/html/wp-content/mu-plugins:ro
    depends_on: [db, delivery]
  cli:
    image: wordpress:cli-2.12.0-php8.3
    entrypoint: [wp]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_DB_USER: shop
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: shop
      WORDPRESS_CONFIG_EXTRA: |
        define("WP_HOME", "http://" . ($$_SERVER["HTTP_HOST"] ?? "localhost"));
        define("WP_SITEURL", WP_HOME);
        define("DISABLE_WP_CRON", true);
    volumes:
      - wordpress:/var/www/html
      - ./source/theme:/var/www/html/wp-content/themes/velquorra:ro
      - ./runtime:/var/www/html/wp-content/mu-plugins:ro
      - ./fixtures:/fixtures:ro
    depends_on: [web]
  delivery:
    image: python:3.12.11-alpine3.22
    command: [python, /service/server.py]
    volumes: [./fixtures:/service:ro]
  browser:
    build: {context: ., dockerfile: tests/Dockerfile}
    init: true
    ipc: host
    environment:
      BASE_URL: http://web
    volumes: [./:/work/case]
    working_dir: /work/case
    profiles: [tools]
  art:
    build: {context: ., dockerfile: tools/Dockerfile}
    volumes: [./:/case]
    working_dir: /case
    profiles: [tools]
volumes:
  wordpress:
  database:
