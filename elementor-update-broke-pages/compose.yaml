services:
  db:
    image: mariadb:11.4.5
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run scripts/stage.sh init first}
      MARIADB_ROOT_PASSWORD: ${ROOT_PASSWORD:?Run scripts/stage.sh init first}
    volumes: [database:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 40
  web:
    image: wordpress:6.7.1-php8.2-apache
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80"]
    environment: &wordpress
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('DISABLE_WP_CRON', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes: [wordpress:/var/www/html]
    depends_on:
      db: {condition: service_healthy}
  cli:
    image: wordpress:cli-2.12.0-php8.2
    user: '33:33'
    environment:
      <<: *wordpress
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PORT: ${PORT:-8080}
    volumes:
      - wordpress:/var/www/html
      - ./fixtures:/fixtures:ro
      - ./packages:/packages:ro
      - ./scripts:/scripts:ro
    profiles: [tools]
  browser:
    build: {context: ., dockerfile: tests/Dockerfile}
    network_mode: host
    environment:
      BASE_URL: http://localhost:${PORT:-8080}
    volumes: ['.:/case']
    profiles: [tools]
volumes:
  database:
  wordpress:
